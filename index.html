<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TEF21 Repair Request</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
html, body { background:#f0f2f5; }
body { font-family:'Segoe UI', Tahoma, Verdana, sans-serif; padding:15px; padding-top:max(15px, env(safe-area-inset-top)); padding-bottom:max(15px, env(safe-area-inset-bottom)); margin:0; color:#333; }
.app-container { max-width:500px; margin:auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
.header-title { color:#005691; text-align:center; margin:0 0 20px; font-size:22px; border-bottom:3px solid #E20015; padding-bottom:10px; }
.form-group { margin-bottom:15px; }
label { font-weight:600; display:block; margin-bottom:5px; font-size:14px; color:#555; }
input[type=text], select { width:100%; padding:12px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-size:16px; }
input[type=text]:focus, select:focus { border-color:#005691; outline:none; }

.upload-btn-wrapper { position:relative; overflow:hidden; width:100%; margin-bottom:10px; }
.upload-btn { border:2px dashed #005691; color:#005691; background:#f8f9fa; padding:12px 20px; border-radius:8px; font-size:16px; font-weight:bold; text-align:center; }
.upload-btn-wrapper input[type=file] { position:absolute; left:0; top:0; opacity:0; width:100%; height:100%; cursor:pointer; }
.count-row { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#888; margin-bottom:8px; }
#img-count { font-weight:700; color:#005691; font-size:13px; }
#img-empty { text-align:center; color:#aaa; font-size:14px; padding:26px 10px; border:1px solid #ddd; border-radius:8px; background:#fafafa; }

.img-card { border:1px solid #ddd; border-radius:8px; padding:8px; margin-bottom:12px; background:#fafafa; }
.img-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:14px; color:#333; }
.mini { background:#6c757d; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:13px; margin-left:4px; }
.mini.danger { background:#c62828; }
.cwrap { border-radius:6px; overflow:hidden; background:#fff; }
.cwrap canvas { display:block; width:100%; cursor:crosshair; touch-action:none; }

.submit-btn { background:#E20015; color:#fff; border:none; padding:16px; width:100%; margin-top:25px; font-size:18px; font-weight:bold; border-radius:8px; cursor:pointer; }
.submit-btn:disabled { background:#ccc; cursor:not-allowed; }
.share-btn { background:#005691; color:#fff; border:none; padding:14px; width:100%; margin-top:12px; font-size:17px; font-weight:bold; border-radius:8px; cursor:pointer; }
.share-btn:disabled { background:#ccc; cursor:not-allowed; }
#mail-hint { display:none; margin-top:12px; padding:12px; border:1px solid #cde; background:#f3f8fc; border-radius:8px; font-size:14px; line-height:1.5; }
#mail-hint a { display:inline-block; margin-top:6px; padding:10px 14px; background:#005691; color:#fff; border-radius:6px; text-decoration:none; font-weight:bold; }
#toolbar { display:none; position:sticky; top:0; z-index:5; background:#fff; border:1px solid #cfd8e3; border-radius:10px; padding:8px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.08); flex-wrap:wrap; gap:6px; align-items:center; }
#toolbar .tool { background:#eef2f7; color:#234; border:2px solid transparent; padding:8px 10px; border-radius:8px; font-size:14px; cursor:pointer; }
#toolbar .tool.active { background:#005691; color:#fff; border-color:#003a63; }
#toolbar .sep { width:1px; height:24px; background:#ddd; margin:0 2px; }
#toolbar .dot { width:26px; height:26px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px #aaa; cursor:pointer; display:inline-block; }
#toolbar .dot.on { box-shadow:0 0 0 3px #005691; }
.img-head .btns { display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
.img-head .mini { margin-left:0; }
.img-head .t { color:#555; }
.img-head .t.main { color:#005691; }
.frame-wrap { border:3px solid #8e2a8e; background:#fff; border-radius:2px; }
#frame-canvas { display:block; width:100%; height:auto; touch-action:none; cursor:move; }
.frame-tools { margin-top:8px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#888; gap:8px; }
.mode-row { display:flex; gap:6px; margin:6px 0 8px; }
.mode-row .mode { flex:1; background:#eef2f7; color:#234; border:2px solid transparent; padding:10px 8px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
.mode-row .mode.active { background:#005691; color:#fff; border-color:#003a63; }
.frame-tools .acts { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }

/* ===== จอคอม: แบ่ง 2 คอลัมน์ ซ้าย = ฟอร์ม+รูป, ขวา = กรอบ PDF ขนาดใหญ่ (ติดหน้าจอตอนเลื่อน) ===== */
@media (min-width: 960px) {
  body { padding:24px; }
  .app-container { max-width:1320px; padding:28px 32px; }
  .layout { display:grid; grid-template-columns: minmax(400px, 480px) 1fr; gap:32px; align-items:start; }
  .col-right { position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; padding-right:4px; }
  #frame-panel { display:block !important; margin-top:0 !important; }
  .col-right label { font-size:15px; }
  .mode-row .mode { padding:12px; font-size:15px; }
  .frame-tools { font-size:13px; }
  .submit-btn { margin-top:18px !important; }
}
@media (min-width: 1500px) {
  .app-container { max-width:1560px; }
  .layout { grid-template-columns: minmax(420px, 500px) 1fr; }
}
</style>
</head>
<body>

<div class="app-container">
  <h2 class="header-title">Repair Detail Sheet</h2>

  <div class="layout">
  <div class="col-left">
  <div class="form-group">
    <label>Mold No.</label>
    <input type="text" id="moldNo" placeholder="ระบุ Mold No.">
  </div>
  <div class="form-group">
    <label>Problem (ปัญหา)</label>
    <input type="text" id="problem" placeholder="ระบุ ปัญหา">
  </div>
  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <div style="flex:1;"><label>Request by</label><input type="text" id="requestBy" placeholder="ชื่อผู้แจ้ง"></div>
    <div style="flex:1;"><label>Accept by</label><input type="text" id="acceptBy" placeholder="ชื่อผู้รับ (เว้นว่างได้)"></div>
  </div>

  <div class="form-group">
    <label>Request Detail (จุดซ่อม)</label>
    <select id="requestDetail">
      <option value="wedm">Welding and EDM</option>
      <option value="wmill">Welding and milling</option>
      <option value="wwire">Welding and wire cut</option>
      <option value="wgrind">Welding and grinding</option>
      <option value="wire">Wire cut</option>
      <option value="mill">Milling</option>
      <option value="modgrind">Ad air vent by grinding</option>
      <option value="modmill">Ad air vent by milling</option>
    </select>
  </div>

  <div class="form-group">
    <label>ภาพหน้างาน (ถ่ายรูป & วาดวงกลม)</label>
    <div class="upload-btn-wrapper">
      <div class="upload-btn">📸 เพิ่มรูป (ถ่ายรูป / เลือกไฟล์ / ลากไฟล์มาวางได้)</div>
      <input type="file" id="imageLoader" accept="image/*" multiple>
    </div>
    <div class="count-row">
      <span>* เลือกเครื่องมือด้านบน แล้ววาดทับจุดเสียบนแต่ละรูป</span>
      <span id="img-count">0/8</span>
    </div>
    <div id="toolbar">
      <button class="tool" data-tool="pen">✏️ วาดมือ</button>
      <button class="tool active" data-tool="ellipse">⭕ วงกลม</button>
      <button class="tool" data-tool="rect">▭ สี่เหลี่ยม</button>
      <button class="tool" data-tool="arrow">➡️ ลูกศร</button>
      <span class="sep"></span>
      <span class="dot on" data-col="#E20015" style="background:#E20015"></span>
      <span class="dot" data-col="#FFD400" style="background:#FFD400"></span>
      <span class="dot" data-col="#1E6CFF" style="background:#1E6CFF"></span>
    </div>
    <div id="img-empty">ยังไม่มีรูป กดปุ่มด้านบนเพื่อเพิ่มรูป</div>
    <div id="img-list"></div>

  </div>

  </div><!-- /col-left -->

  <div class="col-right">
    <div id="frame-panel" style="display:none; margin-top:6px;">
      <label>จัดวางรูปในกรอบ PDF</label>
      <div class="mode-row">
        <button class="mode active" type="button" data-mode="move">✋ จัดวางรูป</button>
        <button class="mode" type="button" data-mode="draw">✏️ วาดบนกรอบ</button>
      </div>
      <div class="frame-wrap"><canvas id="frame-canvas"></canvas></div>
      <div class="frame-tools">
        <span id="frame-hint"></span>
        <span class="acts">
          <button class="mini" type="button" onclick="frameUndo()">↶ ย้อน</button>
          <button class="mini" type="button" onclick="frameClear()">ล้างรอยบนกรอบ</button>
          <button class="mini" type="button" onclick="autoLayout()">🔄 จัดอัตโนมัติ</button>
        </span>
      </div>
    </div>
  <button class="submit-btn" id="submitBtn" style="margin-top:25px;" onclick="generatePDF()">📄 สร้างเอกสาร PDF</button>
  <button class="share-btn" id="shareBtn" onclick="sharePDF()">📧 แชร์ไฟล์ PDF (แนบไฟล์ส่งเมล)</button>
  <button class="share-btn" style="background:#3a7ab0;" onclick="openMail()">✉️ เปิดอีเมลถึง mfh2hmj@bosch.com</button>
  <div id="mail-hint"></div>
  </div><!-- /col-right -->
  </div><!-- /layout -->
</div>

<script>
/* ============ รูปหลายรูป + เครื่องมือวาด (มือ/วงกลม/สี่เหลี่ยม/ลูกศร) ============ */
const MAX_IMAGES = 8;
const LINE_W = 4;
const MAX_SIDE = 1600;               // ย่อรูปใหญ่ๆ จากกล้องเพื่อไม่ให้เครื่องช้า/หน่วยความจำเต็ม
let items = [];                      // { src, shapes, current, canvas, ctx, title, card }
let tool = 'ellipse';
let color = '#E20015';

const listEl = document.getElementById('img-list');
const emptyEl = document.getElementById('img-empty');
const countEl = document.getElementById('img-count');
const toolbarEl = document.getElementById('toolbar');
const loader = document.getElementById('imageLoader');

document.querySelectorAll('#toolbar .tool').forEach(b => b.addEventListener('click', () => {
  tool = b.dataset.tool;
  document.querySelectorAll('#toolbar .tool').forEach(x => x.classList.toggle('active', x === b));
}));
document.querySelectorAll('#toolbar .dot').forEach(d => d.addEventListener('click', () => {
  color = d.dataset.col;
  document.querySelectorAll('#toolbar .dot').forEach(x => x.classList.toggle('on', x === d));
}));


loader.addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  loader.value = '';
  const room = MAX_IMAGES - items.length;
  if (room <= 0) { alert('เพิ่มรูปได้สูงสุด ' + MAX_IMAGES + ' รูป'); return; }
  if (files.length > room) alert('เพิ่มรูปได้สูงสุด ' + MAX_IMAGES + ' รูป จะใช้เฉพาะ ' + room + ' รูปแรก');
  for (const f of files.slice(0, room)) {      // โหลดทีละรูปเพื่อให้ลำดับตรงกับที่เลือก
    try { createItem(await loadFile(f)); }
    catch (err) { alert('เปิดรูปไม่ได้: ' + f.name); }
  }
});

function loadFile(f) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}

function validShape(s) {
  if (s.t === 'pen') return s.pts.length >= 1;
  return Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y) > 0.015;
}

function createItem(src) {
  if (items.length >= MAX_IMAGES) return;
  const card = document.createElement('div');
  card.className = 'img-card';
  card.innerHTML =
    '<div class="img-head"><b class="t"></b><span class="btns">' +
    '<button class="mini" data-act="undo">↶ ย้อน</button>' +
    '<button class="mini" data-act="clear">ล้าง</button>' +
    '<button class="mini danger" data-act="del">ลบรูป</button></span></div>' +
    '<div class="cwrap"><canvas></canvas></div>';
  listEl.appendChild(card);

  const canvas = card.querySelector('canvas');
  const item = { src, shapes: [], current: null, canvas, ctx: canvas.getContext('2d'), title: card.querySelector('.t'), card };
  canvas.width = card.querySelector('.cwrap').clientWidth || 400;
  canvas.height = Math.round(canvas.width * src.height / src.width);
  items.push(item);
  item.z = ++zc;
  if (!layoutManual) { refreshUI(); autoLayout(); }
  else {                                  // จัดเองอยู่แล้ว: วางรูปใหม่เป็นก้อนเล็กเยื้องมุมซ้ายบน ให้ผู้ใช้ลากไปวางเอง
    const w = Math.min(240, FRAME_W * 0.3), off = ((items.length - 1) * 28) % 140;
    item.box = { x: 12 + off, y: 12 + off, w };
    const h = boxH(item); if (item.box.y + h > FRAME_H) item.box.y = Math.max(0, FRAME_H - h);
  }

  let drawing = false;
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x:(e.clientX - r.left)/r.width, y:(e.clientY - r.top)/r.height }; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); canvas.setPointerCapture(e.pointerId); drawing = true;
    const p = pos(e);
    item.current = tool === 'pen' ? { t:'pen', c:color, pts:[p] } : { t:tool, c:color, a:p, b:p };
    render(item);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return; e.preventDefault();
    const p = pos(e);
    if (item.current.t === 'pen') item.current.pts.push(p); else item.current.b = p;
    render(item);
  });
  const end = () => {
    if (!drawing) return; drawing = false;
    const s = item.current; item.current = null;
    if (s && validShape(s)) item.shapes.push(s);
    render(item);
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  card.addEventListener('click', e => {
    const act = e.target && e.target.dataset && e.target.dataset.act;
    if (!act) return;
    if (act === 'undo') { item.shapes.pop(); render(item); }
    if (act === 'clear') { item.shapes = []; item.current = null; render(item); }
    if (act === 'del') {
      if (!confirm('ลบรูปนี้?')) return;
      items = items.filter(x => x !== item);
      if (selected === item) selected = null;
      card.remove();
      refreshUI();
      if (!layoutManual) autoLayout(); else scheduleFrame();
    }
  });

  render(item);
  refreshUI();
}

function refreshUI() {
  items.forEach((it, i) => {
    it.title.textContent = 'รูปที่ ' + (i + 1);
  });
  countEl.textContent = items.length + '/' + MAX_IMAGES;
  emptyEl.style.display = items.length ? 'none' : 'block';
  toolbarEl.style.display = items.length ? 'flex' : 'none';
  document.getElementById('frame-panel').style.display = items.length ? 'block' : 'none';
}

function render(it) {
  const c = it.ctx, w = it.canvas.width, h = it.canvas.height;
  c.fillStyle = '#fff'; c.fillRect(0, 0, w, h);
  c.drawImage(it.src, 0, 0, w, h);
  drawShapes(c, it.current ? it.shapes.concat([it.current]) : it.shapes, 0, 0, w, h, LINE_W);
  scheduleFrame();
}

// วาดรูปทรงทั้งหมด (พิกัดเก็บเป็นสัดส่วน 0-1 ของรูป จึงวาดซ้ำที่ความละเอียดสูงตอนทำ PDF ได้)
function drawShapes(c, list, ox, oy, w, h, lw) {
  c.save();
  c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
  list.forEach(s => {
    c.strokeStyle = s.c; c.fillStyle = s.c;
    if (s.t === 'pen') {
      const p = s.pts;
      c.beginPath();
      c.moveTo(ox + p[0].x*w, oy + p[0].y*h);
      if (p.length === 1) c.lineTo(ox + p[0].x*w + 0.1, oy + p[0].y*h);
      for (let i = 1; i < p.length; i++) c.lineTo(ox + p[i].x*w, oy + p[i].y*h);
      c.stroke();
      return;
    }
    const x1 = ox + s.a.x*w, y1 = oy + s.a.y*h, x2 = ox + s.b.x*w, y2 = oy + s.b.y*h;
    if (s.t === 'rect') {
      c.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
    } else if (s.t === 'ellipse') {
      c.beginPath();
      c.ellipse((x1 + x2)/2, (y1 + y2)/2, Math.abs(x2 - x1)/2, Math.abs(y2 - y1)/2, 0, 0, Math.PI*2);
      c.stroke();
    } else if (s.t === 'arrow') {
      const ang = Math.atan2(y2 - y1, x2 - x1), hl = lw*4 + 8;
      c.beginPath(); c.moveTo(x1, y1);
      c.lineTo(x2 - Math.cos(ang)*hl*0.6, y2 - Math.sin(ang)*hl*0.6);
      c.stroke();
      c.beginPath(); c.moveTo(x2, y2);
      c.lineTo(x2 - hl*Math.cos(ang - 0.45), y2 - hl*Math.sin(ang - 0.45));
      c.lineTo(x2 - hl*Math.cos(ang + 0.45), y2 - hl*Math.sin(ang + 0.45));
      c.closePath(); c.fill();
    }
  });
  c.restore();
}

/* ============ ตัวจัดวางรูปในกรอบ (ลากย้าย / ลากมุมย่อขยาย) ============ */
const FRAME_W = 858, FRAME_H = 529;     // พื้นที่ภายในกรอบสีม่วงใน PDF (px)
const frameCanvas = document.getElementById('frame-canvas');
const fctx = frameCanvas.getContext('2d');
frameCanvas.width = FRAME_W; frameCanvas.height = FRAME_H;
let layoutManual = false, selected = null, zc = 0, rafPending = false, drag = null;
let frameMode = 'move';              // 'move' = จัดวางรูป, 'draw' = วาดลูกศร/วงกลม/สี่เหลี่ยมบนกรอบ (ไม่ผูกกับรูป)
let frameShapes = [], fcur = null, fdrawing = false;
const FRAME_LINE = 4;

const boxH = it => it.box.w * it.src.height / it.src.width;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function gridFor(n) {
  if (n <= 1) return [1, 1];
  if (n === 2) return [2, 1];
  if (n === 3) return [3, 1];
  if (n === 4) return [2, 2];
  if (n <= 6) return [3, 2];
  return [4, 2];
}

function autoLayout() {
  const n = items.length;
  layoutManual = false;
  if (!n) return;
  const [cols, rows] = gridFor(n), gap = 6;
  const cw = (FRAME_W - gap*(cols-1)) / cols, ch = (FRAME_H - gap*(rows-1)) / rows;
  items.forEach((it, i) => {
    const r = it.src.height / it.src.width;
    const w = Math.min(cw, ch / r);
    it.box = { x: (i % cols)*(cw + gap) + (cw - w)/2, y: Math.floor(i / cols)*(ch + gap) + (ch - w*r)/2, w };
  });
  scheduleFrame();
}

// วาดรูป+รอยวาดทั้งหมดตามตำแหน่งที่จัดไว้ (ใช้ทั้งหน้าตัวอย่างและ PDF)
function drawFrameImages(g, preview) {
  items.slice().sort((a, b) => a.z - b.z).forEach(it => {
    const { x, y, w } = it.box, h = boxH(it);
    g.drawImage(it.src, x, y, w, h);
    drawShapes(g, it.shapes, x, y, w, h, Math.max(2.5, LINE_W * (w / it.canvas.width)));
    if (preview && frameMode === 'move') {
      g.strokeStyle = it === selected ? '#1E6CFF' : '#bbb';
      g.lineWidth = it === selected ? 4 : 1.5;
      g.strokeRect(x, y, w, h);
    }
  });
  drawShapes(g, fcur ? frameShapes.concat([fcur]) : frameShapes, 0, 0, FRAME_W, FRAME_H, FRAME_LINE);
  if (preview && frameMode === 'move' && selected) {
    const hx = selected.box.x + selected.box.w, hy = selected.box.y + boxH(selected);
    g.beginPath(); g.arc(hx, hy, 16, 0, Math.PI*2);
    g.fillStyle = '#fff'; g.fill();
    g.lineWidth = 4; g.strokeStyle = '#1E6CFF'; g.stroke();
  }
}

function drawFrame() {
  fctx.fillStyle = '#fff'; fctx.fillRect(0, 0, FRAME_W, FRAME_H);
  drawFrameImages(fctx, true);
}
function scheduleFrame() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; drawFrame(); });
}

function setFrameMode(m) {
  frameMode = m;
  fcur = null; fdrawing = false; drag = null;
  document.querySelectorAll('.mode-row .mode').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  frameCanvas.style.cursor = m === 'draw' ? 'crosshair' : 'move';
  document.getElementById('frame-hint').textContent = m === 'draw'
    ? 'เลือกเครื่องมือ/สีด้านบน แล้วลากบนกรอบ (รอยวาดบนกรอบไม่ตามรูป ให้จัดรูปให้เสร็จก่อน)'
    : 'แตะรูปเพื่อเลือก · ลากเพื่อย้าย · ลากจุดกลมมุมขวาล่างเพื่อย่อ/ขยาย';
  scheduleFrame();
}
document.querySelectorAll('.mode-row .mode').forEach(b => b.addEventListener('click', () => setFrameMode(b.dataset.mode)));
function frameUndo() { frameShapes.pop(); scheduleFrame(); }
function frameClear() { if (frameShapes.length && !confirm('ลบรอยวาดบนกรอบทั้งหมด?')) return; frameShapes = []; scheduleFrame(); }
setFrameMode('move');

const fpos = e => {
  const r = frameCanvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * FRAME_W / r.width, y: (e.clientY - r.top) * FRAME_H / r.height };
};
frameCanvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = fpos(e);
  if (frameMode === 'draw') {
    frameCanvas.setPointerCapture(e.pointerId);
    fdrawing = true;
    const q = { x: p.x / FRAME_W, y: p.y / FRAME_H };
    fcur = tool === 'pen' ? { t:'pen', c:color, pts:[q] } : { t:tool, c:color, a:q, b:q };
    scheduleFrame();
    return;
  }
  if (selected) {                                  // จับที่จุดกลมมุมขวาล่าง = ย่อ/ขยาย
    const hx = selected.box.x + selected.box.w, hy = selected.box.y + boxH(selected);
    if (Math.hypot(p.x - hx, p.y - hy) <= 36) {
      drag = { mode:'resize', it:selected, sx:p.x, sy:p.y, w0:selected.box.w };
      frameCanvas.setPointerCapture(e.pointerId);
      return;
    }
  }
  const hit = items.slice().sort((a, b) => b.z - a.z).find(it =>
    p.x >= it.box.x && p.x <= it.box.x + it.box.w && p.y >= it.box.y && p.y <= it.box.y + boxH(it));
  selected = hit || null;
  if (hit) {
    hit.z = ++zc;
    drag = { mode:'move', it:hit, sx:p.x, sy:p.y, x0:hit.box.x, y0:hit.box.y };
    frameCanvas.setPointerCapture(e.pointerId);
  }
  scheduleFrame();
});
frameCanvas.addEventListener('pointermove', e => {
  if (fdrawing && fcur) {
    e.preventDefault();
    const p = fpos(e), q = { x: clamp(p.x / FRAME_W, 0, 1), y: clamp(p.y / FRAME_H, 0, 1) };
    if (fcur.t === 'pen') fcur.pts.push(q); else fcur.b = q;
    scheduleFrame();
    return;
  }
  if (!drag) return;
  e.preventDefault();
  const p = fpos(e), it = drag.it, r = it.src.height / it.src.width;
  const dx = p.x - drag.sx, dy = p.y - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 2) layoutManual = true;
  if (drag.mode === 'move') {
    it.box.x = clamp(drag.x0 + dx, 0, FRAME_W - it.box.w);
    it.box.y = clamp(drag.y0 + dy, 0, FRAME_H - boxH(it));
  } else {
    const dw = (dx + dy / r) / 2;
    const maxW = Math.min(FRAME_W - it.box.x, (FRAME_H - it.box.y) / r);
    it.box.w = clamp(drag.w0 + dw, Math.min(50, maxW), maxW);
  }
  scheduleFrame();
});
const endFrameDrag = () => {
  drag = null;
  if (fdrawing) {
    fdrawing = false;
    const s = fcur; fcur = null;
    if (s && validShape(s)) frameShapes.push(s);
    scheduleFrame();
  }
};
frameCanvas.addEventListener('pointerup', endFrameDrag);
frameCanvas.addEventListener('pointercancel', endFrameDrag);

const PW = 1122, PH = 792, S = 2;
const FONT = 'Arial, Tahoma, "Noto Sans Thai", sans-serif';
const PLACEHOLDER = 'Click or tap here to enter text.';

function drawPage(data) {
  const pc = document.createElement('canvas');
  pc.width = PW * S; pc.height = PH * S;
  const g = pc.getContext('2d');
  g.scale(S, S);
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#fff'; g.fillRect(0, 0, PW, PH);

  const text = (t, x, y, size, color, bold) => {
    g.font = (bold ? 'bold ' : '') + size + 'px ' + FONT;
    g.fillStyle = color;
    g.fillText(t, x, y);
    return g.measureText(t).width;
  };
  // ข้อความที่กรอกแล้วใช้ฟอนต์ใหญ่ ถ้ายาวเกินพื้นที่จะย่อลงอัตโนมัติ (ไม่เล็กกว่า 14px)
  const value = (v, x, y, emptySize, fillSize, maxW) => {
    if (!v) return text(PLACEHOLDER, x, y, emptySize, '#777');
    let size = fillSize;
    for (; size > 14; size--) {
      g.font = size + 'px ' + FONT;
      if (g.measureText(v).width <= maxW) break;
    }
    return text(v, x, y, size, '#000');
  };

  // --- Mold No / Problem ---
  let w = text('Mold No:', 62, 69, 38, '#000');
  g.fillStyle = '#000'; g.fillRect(62, 80, w, 2);
  value(data.mold, 62 + w + 10, 69, 16, 32, 740 - (62 + w + 10));

  w = text('Problem :', 62, 136, 38, '#7a1f7a');
  g.fillStyle = '#7a1f7a'; g.fillRect(62, 147, w, 2);
  value(data.problem, 62 + w + 10, 136, 16, 32, 1095 - (62 + w + 10));

  // --- Request by / Accept by ---
  w = text('Request by:', 765, 51, 20, '#000');
  value(data.req, 765 + w + 6, 51, 15, 24, 1095 - (765 + w + 6));
  w = text('Accept by:', 765, 91, 20, '#000');
  value(data.acc, 765 + w + 6, 91, 15, 24, 1095 - (765 + w + 6));

  // --- กรอบสีม่วง + รูปภาพตามที่จัดวางไว้ ---
  const FX = 27, FY = 160, FW = 864, FH = 535, B = 3;
  const ax = FX + B, ay = FY + B, aw = FW - 2*B, ah = FH - 2*B;
  if (items.length || frameShapes.length) {
    g.save();
    g.beginPath(); g.rect(ax, ay, aw, ah); g.clip();
    g.translate(ax, ay);
    drawFrameImages(g, false);
    g.restore();
  }
  g.strokeStyle = '#8e2a8e'; g.lineWidth = B;
  g.strokeRect(FX + B/2, FY + B/2, FW - B, FH - B);

  // --- Request detail ---
  w = text('Request detail', 940, 179, 26, '#000');
  g.fillStyle = '#000'; g.fillRect(940, 186, w, 2);

  const diamond = (cx, cy) => { g.fillStyle = '#000'; g.beginPath(); g.moveTo(cx, cy-4); g.lineTo(cx+4, cy); g.lineTo(cx, cy+4); g.lineTo(cx-4, cy); g.closePath(); g.fill(); };
  diamond(944, 198); text('Repair insert', 956, 203, 13, '#000');
  diamond(944, 464); text('Modification insert', 956, 469, 13, '#000');

  const rows = [
    ['wedm', 'Welding and EDM', 217],
    ['wmill', 'Welding and milling', 256],
    ['wwire', 'Welding and wire cut', 295],
    ['wgrind', 'Welding and grinding', 334],
    ['wire', 'Wire cut', 371],
    ['mill', 'Milling', 414],
    ['modgrind', 'Ad air vent by grinding', 498],
    ['modmill', 'Ad air vent by milling', 546]
  ];
  rows.forEach(([key, label, top]) => {
    g.strokeStyle = '#000'; g.lineWidth = 2;
    g.strokeRect(925, top + 1, 18, 18);
    text(label, 956, top + 15, 13, '#000');
    if (key === data.detail) {
      g.strokeStyle = '#000'; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(928, top + 10); g.lineTo(933, top + 16); g.lineTo(941, top + 4); g.stroke();
    }
  });

  // --- Footer ---
  text('1', 25, 755, 14, '#999');
  w = text('Internal', 80, 747, 9, '#E20015', true);
  text(' | Powertrain Solutions | HmP/TEF21 2024-08-17', 80 + w, 747, 9, '#444');
  text('© Robert Bosch GmbH 2019. All rights reserved, also regarding any disposal, exploitation, reproduction, editing, distribution, as well as in the event of applications for industrial property rights.', 80, 760, 7, '#aaa');

  if (logoImg.complete && logoImg.naturalWidth) g.drawImage(logoImg, 992, 738, 107, 24);

  // --- แถบสีล่างสุด ---
  const bar = [['#A2243B',.08],['#C0243C',.04],['#E20015',.10],['#5B2C86',.10],['#2E3F8F',.12],['#2563AE',.08],['#3A86C4',.08],['#2FA7CF',.08],['#00A8CB',.08],['#00A06A',.10],['#8CC152',.08],['#3A9A4A',.06]];
  let x = 0;
  bar.forEach(([c, f]) => { const bw = PW * f; g.fillStyle = c; g.fillRect(x, 782, bw + 1, 10); x += bw; });

  return pc;
}

function buildPDF() {
  const moldNo = document.getElementById('moldNo').value.trim();
  const problem = document.getElementById('problem').value.trim();
  const page = drawPage({
    mold: moldNo,
    problem,
    req: document.getElementById('requestBy').value.trim(),
    acc: document.getElementById('acceptBy').value.trim(),
    detail: document.getElementById('requestDetail').value
  });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [PW, PH], hotfixes: ['px_scaling'] });
  pdf.addImage(page.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, PW, PH);
  return {
    pdf, moldNo, problem,
    filename: 'Repair_Request_' + (moldNo || 'Blank') + '.pdf',
    subject: 'แจ้งซ่อม Mold ' + (moldNo || '-') + (problem ? ' : ' + problem : '')
  };
}

// บันทึกไฟล์: ใน claude.ai ใช้ downloads capability, ถ้าเปิดไฟล์เองบนเว็บปกติใช้ pdf.save()
async function savePDF(r) {
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {}
  if (dl) await dl.save({ filename: r.filename, data: r.pdf.output('blob') });
  else r.pdf.save(r.filename);
}

function reportError(err) {
  if (err && (err.code === 'declined' || err.name === 'AbortError')) return;
  console.error(err);
  alert('เกิดข้อผิดพลาด: ' + (err.message || err));
}

async function generatePDF() {
  const btn = document.getElementById('submitBtn');
  btn.innerHTML = '⏳ กำลังสร้างเอกสาร โปรดรอ...';
  btn.disabled = true;
  try { await savePDF(buildPDF()); } catch (err) { reportError(err); }
  btn.innerHTML = '📄 สร้างเอกสาร PDF';
  btn.disabled = false;
}

/* ============ แชร์ / ส่งอีเมล ============ */
const MAIL_TO = 'mfh2hmj@bosch.com';

function mailParts() {
  const mold = document.getElementById('moldNo').value.trim();
  const problem = document.getElementById('problem').value.trim();
  return {
    mold, problem,
    subject: 'แจ้งซ่อม Mold ' + (mold || '-') + (problem ? ' : ' + problem : ''),
    body: 'เรียนผู้เกี่ยวข้อง\n\nแจ้งซ่อม Mold: ' + (mold || '-') + '\nปัญหา: ' + (problem || '-') + '\n\nแนบไฟล์ PDF ตามเอกสารแนบ'
  };
}
function mailHref() {
  const m = mailParts();
  return 'mailto:' + MAIL_TO + '?subject=' + encodeURIComponent(m.subject) + '&body=' + encodeURIComponent(m.body);
}
function openMail() {
  const a = document.createElement('a');
  a.href = mailHref(); a.target = '_top';
  document.body.appendChild(a); a.click(); a.remove();
}

async function sharePDF() {
  const btn = document.getElementById('shareBtn');
  const hint = document.getElementById('mail-hint');
  hint.style.display = 'none';
  btn.disabled = true; btn.innerHTML = '⏳ กำลังเตรียมไฟล์...';

  try {
    const r = buildPDF();
    const body = 'ส่งถึง: ' + MAIL_TO + '\n\nแจ้งซ่อม Mold: ' + (r.moldNo || '-') + '\nปัญหา: ' + (r.problem || '-');
    const file = new File([r.pdf.output('blob')], r.filename, { type: 'application/pdf' });

    // 1) แชร์ไฟล์ตรงๆ ผ่านเมนูแชร์ของมือถือ (เลือก Mail / Outlook / LINE ได้)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: r.subject, text: body });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;   // ผู้ใช้กดยกเลิก
        // ถ้าแชร์ไม่ได้ ให้ใช้วิธีสำรองด้านล่าง
      }
    }

    // 2) วิธีสำรอง: บันทึก PDF แล้วเปิดอีเมลที่กรอกหัวข้อ/เนื้อหาไว้ให้ (ต้องแนบไฟล์เอง)
    await savePDF(r);
    const href = mailHref();
    hint.innerHTML = 'บันทึกไฟล์ <b>' + r.filename + '</b> แล้ว<br>กดปุ่มด้านล่างเพื่อเปิดอีเมลถึง ' + MAIL_TO + ' แล้วแนบไฟล์ PDF ที่เพิ่งบันทึก<br><a href="' + href + '" target="_top">✉️ เปิดอีเมล</a>';
    hint.style.display = 'block';
  } catch (err) {
    reportError(err);
  } finally {
    btn.disabled = false; btn.innerHTML = '📧 แชร์ไฟล์ PDF (แนบไฟล์ส่งเมล)';
  }
}

refreshUI();
</script>
